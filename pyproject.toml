[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recrate"
version = "0.1.0"
description = "Turn a paper into an RO-Crate, verify its claims, reuse its method, and record every run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["jsonschema>=4.18", "scipy>=1.10", "pytest>=7"]
image = ["tifffile", "scikit-image"]
hf = ["huggingface_hub>=0.34"]
agents = ["anthropic"]

[project.scripts]
recrate = "recrate.cli:main"

[tool.setuptools.packages.find]
include = ["recrate*"]
